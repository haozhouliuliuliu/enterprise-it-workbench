name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests eval
          ruff format --check src tests eval
      - name: Tests with coverage gate
        run: pytest -q --cov=workbench --cov-report=term --cov-fail-under=80
      - name: Fixed RAG evaluation
        run: python -m eval.rag_eval --output evidence/rag

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t enterprise-it-workbench:ci .
      - name: Container smoke (health, auth, UI)
        run: |
          docker run -d --name workbench -p 8000:8000 \
            -e SERVICE_API_KEYS='[{"key":"exec-key-123456","user":"alice","role":"executor","department":"研发中心"},{"key":"approver-key-123456","user":"carol","role":"approver","department":"研发中心"},{"key":"admin-key-123456","user":"root","role":"admin"}]' \
            -e DEEPSEEK_API_KEY=sk-dummy-ci \
            -e QWEN_API_KEY=sk-dummy-ci \
            -e KIMI_API_KEY=sk-dummy-ci \
            enterprise-it-workbench:ci
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/health/live > /tmp/live.json; then break; fi
            sleep 1
          done
          cat /tmp/live.json
          python -c "import json; assert json.load(open('/tmp/live.json'))['status']=='ok'"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/v1/tasks)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer exec-key-123456' http://127.0.0.1:8000/v1/admin/tasks)" = "403"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/)" = "200"
          test "$(docker exec workbench id -u)" = "10001"
      - name: Container logs
        if: always()
        run: docker logs workbench
      - name: Stop container
        if: always()
        run: docker rm -f workbench

  compose-https:
    runs-on: ubuntu-latest
    env:
      SERVICE_API_KEYS: '[{"key":"exec-key-123456","user":"alice","role":"executor","department":"研发中心"},{"key":"approver-key-123456","user":"carol","role":"approver","department":"研发中心"},{"key":"admin-key-123456","user":"root","role":"admin"}]'
      DEEPSEEK_API_KEY: sk-dummy-ci
      QWEN_API_KEY: sk-dummy-ci
      KIMI_API_KEY: sk-dummy-ci
    steps:
      - uses: actions/checkout@v4
      - name: Start Compose with Caddy HTTPS
        run: |
          docker compose up -d --build
          for _ in $(seq 1 60); do
            if curl -k -fsS https://localhost:8443/health/live > /tmp/live.json; then break; fi
            sleep 2
          done
          cat /tmp/live.json
          test "$(curl -k -s -o /dev/null -w '%{http_code}' https://localhost:8443/v1/tasks)" = "401"
          test "$(curl -k -s -o /dev/null -w '%{http_code}' https://localhost:8443/)" = "200"
      - name: Compose logs
        if: always()
        run: docker compose logs
      - name: Shutdown
        if: always()
        run: docker compose down -v
